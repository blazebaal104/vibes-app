name: probe spotify
on:
  push:
    branches: [ probe-spotify ]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/probe/spotify.py 37i9dQZF1DX4UtSsGT1Sbe 37i9dQZF1DXbTxeAdrVG2l > probe.txt 2>&1 || true
      - run: cat probe.txt
