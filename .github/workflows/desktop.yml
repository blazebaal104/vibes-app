name: Vibes Windows

on:
  push:
    branches: [ desktop ]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: vibes-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Compile desktop app
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew -p desktop compileKotlin --stacktrace --continue 2>&1 | tee build.log
          ./gradlew -p desktop packageUberJarForCurrentOS 2>&1 | tee -a build.log
          ls -la desktop/build/compose/jars
      - name: Desktop compile errors
        if: failure()
        run: |
          grep -E "^e: " build.log | sed 's|file:///home/runner/work/Vibes/Vibes/desktop/build/shared/||; s|file:///home/runner/work/Vibes/Vibes/desktop/src/main/kotlin/|DESKTOP/|' | sort -u | head -300 > desktop-errors.txt || true
          grep -E "What went wrong" -A12 build.log | head -60 >> desktop-errors.txt || true
          cat desktop-errors.txt
      - name: Share test jar (git branch desktop-bin, split in parts)
        run: |
          mkdir -p /tmp/bin && cd /tmp/bin
          cp $GITHUB_WORKSPACE/desktop/build/compose/jars/*.jar vibes.jar
          split -b 45m vibes.jar vibes.jar.part- && rm vibes.jar
          git init -q && git checkout -q -b desktop-bin
          git add . && git -c user.name=ci -c user.email=ci@vibes commit -qm "test jar ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" desktop-bin
      - uses: actions/upload-artifact@v4
        with:
          name: vibes-linux-jar
          path: desktop/build/compose/jars/*.jar
          retention-days: 3

  windows:
    needs: compile
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Build Windows installer
        shell: bash
        run: |
          N=$(git rev-list --count HEAD)
          ./gradlew -p desktop packageExe -PvibesCode=$N -PvibesVersion=1.0.$N --stacktrace 2>&1 | tee win.log
          find desktop/build/compose/binaries -name "*.exe" -exec ls -la {} \;
          mkdir -p out && cp $(find desktop/build/compose/binaries -name "*.exe" | head -1) out/Vibes-Setup.exe
      - name: Smoke test on Windows (start the app, screenshot, log)
        shell: pwsh
        run: |
          ./gradlew -p desktop createDistributable -q
          $exe = Get-ChildItem -Recurse desktop/build/compose/binaries/main/app -Filter Vibes.exe | Select-Object -First 1
          Write-Host "app: $($exe.FullName)"
          $p = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 45
          New-Item -ItemType Directory -Force shots | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("shots/windows.png")
          Write-Host "still running: $(-not $p.HasExited)"
          Get-Content "$env:APPDATA/Vibes/vibes.log" -ErrorAction SilentlyContinue | Select-Object -First 80
          Copy-Item "$env:APPDATA/Vibes/vibes.log" shots/ -ErrorAction SilentlyContinue
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force } else { exit 1 }
      - name: Publish Windows screenshot
        if: always()
        shell: bash
        run: |
          cd shots || exit 0
          git init -q && git checkout -q -b desktop-shots-win
          git add . && git -c user.name=ci -c user.email=ci@vibes commit -qm "windows smoke"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" desktop-shots-win
      - name: Windows errors
        if: failure()
        shell: bash
        run: grep -E "error|Error|What went wrong" -A8 win.log | head -120
      - uses: actions/upload-artifact@v4
        with:
          name: Vibes-Windows
          path: out/Vibes-Setup.exe
          retention-days: 7
