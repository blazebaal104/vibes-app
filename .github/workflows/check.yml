name: Check (compile only)
on:
  push:
    branches: [ check ]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { cache-read-only: true }
      - name: Compile app
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:compileReleaseKotlin --build-cache --parallel --no-configuration-cache 2>&1 | tee build.log
      - name: Errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong" -A3 build.log | head -150
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { cache-read-only: true }
      - name: Compile desktop
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew -p desktop compileKotlin --no-configuration-cache 2>&1 | tee build.log
      - name: Errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong" -A3 build.log | head -150
