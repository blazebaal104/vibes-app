name: Build Vibes

on:
  push:
    branches: [ main ]
    paths-ignore: [ '.github/probe/**', '.github/workflows/probe.yml', '.github/workflows/uitest.yml', '.github/workflows/desktop.yml', 'desktop/uitest/**' ]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

# a newer push makes the running build pointless (it contains everything): cancel it
concurrency:
  group: vibes-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Signing key (from the Vibes backend, never stored in the public repository)
        run: |
          set -e
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=vibes-release" | jq -r .value)
          R=$(curl -sS --fail-with-body -X POST https://kxgswrwitsedppjzcokh.supabase.co/functions/v1/vibes-release \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{"keystore":true}')
          echo "$R" | jq -r .keystore | base64 -d > app/vibes.keystore
          PW=$(echo "$R" | jq -r .password)
          echo "::add-mask::$PW"
          echo "VIBES_KEYSTORE_PASSWORD=$PW" >> $GITHUB_ENV
          test -s app/vibes.keystore

      - name: Build release APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleRelease --build-cache --parallel --stacktrace --no-configuration-cache 2>&1 | tee build.log

      - name: Playback tests (Deezer login recovery)
        run: |
          set -o pipefail
          ./gradlew :app:testReleaseUnitTest --tests "dev.brahmkshatriya.echo.vibes.*" --build-cache --parallel --no-configuration-cache 2>&1 | tee -a build.log
          ls app/build/test-results/testReleaseUnitTest/ || true

      - name: Test details (messages and prints of every test)
        if: always()
        run: |
          for f in app/build/test-results/testReleaseUnitTest/*.xml; do
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          r = ET.parse(sys.argv[1]).getroot()
          for tc in r.iter("testcase"):
              f = tc.find("failure")
              print(("FAIL " if f is not None else "ok   ") + tc.get("classname").split(".")[-1] + " > " + tc.get("name"))
              if f is not None: print("     " + (f.get("message") or "")[:400])
          out = r.find("system-out")
          if out is not None and out.text and out.text.strip(): print("\n".join("     | " + l for l in out.text.strip().splitlines()[:30]))
          PY
          done || true

      - name: Publish build errors
        if: failure()
        run: |
          grep -E "^e: |error:|ERROR:|What went wrong|AAPT|Unresolved|FAILED|Test.*>|AssertionError|Exception" -A3 build.log | head -400 > build-errors.txt || true
          tail -80 build.log >> build-errors.txt
          gh release delete build-errors -y --cleanup-tag || true
          gh release create build-errors build-errors.txt --title "Build errors" --notes "run ${{ github.run_id }}" --prerelease
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Collect APK
        id: apk
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          mkdir -p out
          cp "$APK" out/Vibes.apk
          # PC build (x86_64) for Android emulators on Windows/Mac: same code, other native libs
          ./gradlew :app:assembleRelease -PvibesPc=true --build-cache --parallel --no-configuration-cache -q
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK" out/Vibes-pc.apk
          ls -la out
          echo "count=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Vibes
          path: out/Vibes.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.apk.outputs.count }}
          name: Vibes (build ${{ steps.apk.outputs.count }})
          body: APK di Vibes.
          files: |
            out/Vibes.apk
            out/Vibes-pc.apk
          make_latest: true

      - name: Publish in-app update
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          N=${{ steps.apk.outputs.count }}
          FN=https://kxgswrwitsedppjzcokh.supabase.co/functions/v1/vibes-release
          PUB=https://kxgswrwitsedppjzcokh.supabase.co/storage/v1/object/public/vibes-updates
          {
            TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=vibes-release" | jq -r .value)
            R=$(curl -sS --fail-with-body -X POST "$FN" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"version\":$N}")
            echo "function: ok"
            APK_URL=$(echo "$R" | jq -r .apk); LATEST_URL=$(echo "$R" | jq -r .latest)
            curl -sS --fail-with-body -X PUT "$APK_URL" -H "Content-Type: application/vnd.android.package-archive" -H "x-upsert: true" --data-binary @out/Vibes.apk
            echo; echo "apk: uploaded"
            PC_URL=$(echo "$R" | jq -r '.pc // empty')
            PC_OK=false
            # the PC build must never block the phone update
            if [ -n "$PC_URL" ] && curl -sS --fail-with-body -X PUT "$PC_URL" -H "Content-Type: application/vnd.android.package-archive" -H "x-upsert: true" --data-binary @out/Vibes-pc.apk; then
              PC_OK=true; echo; echo "pc apk: uploaded"
            else
              echo; echo "pc apk: NOT uploaded (phone update still published)"
            fi
            TITLE=$(jq -r '.title // "Aggiornamento"' RELEASE_NOTES.json 2>/dev/null || echo "Aggiornamento")
            NOTES=$(jq -c '.notes // []' RELEASE_NOTES.json 2>/dev/null || echo "[]")
            SIZE=$(stat -c %s out/Vibes.apk)
            jq -n --argjson code "$N" --arg name "1.0.$N" --arg title "$TITLE" --argjson notes "$NOTES" \
              --arg apk "$PUB/Vibes-$N.apk" --argjson size "$SIZE" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg apkpc "$PUB/Vibes-pc-$N.apk" --argjson sizepc "$(stat -c %s out/Vibes-pc.apk)" \
              --argjson pcok "$PC_OK" \
              '{versionCode:$code, versionName:$name, title:$title, notes:$notes, apk:$apk, size:$size, date:$date} + (if $pcok then {apk_pc:$apkpc, size_pc:$sizepc} else {} end)' > latest.json
            cat latest.json
            curl -sS --fail-with-body -X PUT "$LATEST_URL" -H "Content-Type: application/json" -H "x-upsert: true" --data-binary @latest.json
            echo; echo "latest.json: uploaded"
          } 2>&1 | tee update-log.txt
          RC=${PIPESTATUS[0]}
          gh release upload build-$N update-log.txt --clobber || true
          exit $RC

  # Vibes for Windows: same build number, installer published next to the APK (in 45 MB parts:
  # the storage limit is 50 MB per file) and added to latest.json for in-app updates on PC.
  # Runs IN PARALLEL with the phone build (saves ~6 minutes); it only waits for the phone release
  # before attaching/publishing, so latest.json is still written phone first, Windows second.
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Build Windows installer
        shell: bash
        run: |
          set -o pipefail
          N=$(git rev-list --count HEAD)
          echo "N=$N" >> $GITHUB_ENV
          ./gradlew -p desktop packageExe -PvibesCode=$N -PvibesVersion=1.0.$N --stacktrace 2>&1 | tee win.log
          mkdir -p out && cp "$(find desktop/build/compose/binaries -name '*.exe' | head -1)" out/Vibes-Setup.exe
          ls -la out
      - name: Windows build errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|What went wrong" -A6 win.log | head -150
      - name: Wait for the phone release
        id: wait
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PUB=https://kxgswrwitsedppjzcokh.supabase.co/storage/v1/object/public/vibes-updates
          for i in $(seq 1 120); do
            V=$(curl -sS "$PUB/latest.json?t=$(date +%s)" | jq -r .versionCode 2>/dev/null || true)
            if [ "$V" = "$N" ]; then echo "phone release $N is out"; echo "ok=true" >> $GITHUB_OUTPUT; exit 0; fi
            sleep 15
          done
          echo "phone release $N never appeared (phone build failed or was replaced): Windows not published"
          echo "ok=false" >> $GITHUB_OUTPUT
      - name: Attach to the release
        if: steps.wait.outputs.ok == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload build-$N out/Vibes-Setup.exe --clobber || true
      - name: Keep the installer in git (branch windows-exe) for direct sharing
        if: steps.wait.outputs.ok == 'true'
        shell: bash
        run: |
          mkdir -p /tmp/exe && cp out/Vibes-Setup.exe /tmp/exe/ && cd /tmp/exe
          split -b 45m Vibes-Setup.exe Vibes-Setup.exe.part- && rm Vibes-Setup.exe
          echo "$N" > VERSION
          git init -q && git checkout -q -b windows-exe
          git add . && git -c user.name=ci -c user.email=ci@vibes commit -qm "Vibes for Windows build $N"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" windows-exe
      - name: Publish Windows update
        if: steps.wait.outputs.ok == 'true'
        shell: bash
        run: |
          set -e
          FN=https://kxgswrwitsedppjzcokh.supabase.co/functions/v1/vibes-release
          PUB=https://kxgswrwitsedppjzcokh.supabase.co/storage/v1/object/public/vibes-updates
          cd out
          split -b 45m -d -a 1 Vibes-Setup.exe part
          K=$(ls part* | wc -l)
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=vibes-release" | jq -r .value)
          R=$(curl -sS --fail-with-body -X POST "$FN" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"version\":$N,\"windows\":$K}")
          for i in $(seq 0 $((K-1))); do
            URL=$(echo "$R" | jq -r ".parts[$i]")
            curl -sS --fail-with-body -X PUT "$URL" -H "Content-Type: application/octet-stream" -H "x-upsert: true" --data-binary @part$i > /dev/null
            echo "part $i uploaded"
          done
          curl -sS --fail-with-body "$PUB/latest.json?t=$(date +%s)" -o latest.json
          if [ "$(jq -r .versionCode latest.json)" != "$N" ]; then echo "latest.json is for another build: not touching it"; exit 0; fi
          PARTS=$(for i in $(seq 0 $((K-1))); do echo "$PUB/win/Vibes-win-$N.part$i"; done | jq -R . | jq -s -c .)
          jq --argjson parts "$PARTS" --argjson size "$(stat -c %s Vibes-Setup.exe)" '. + {exe_parts: $parts, size_exe: $size}' latest.json > latest2.json
          cat latest2.json
          curl -sS --fail-with-body -X PUT "$(echo "$R" | jq -r .latest)" -H "Content-Type: application/json" -H "x-upsert: true" --data-binary @latest2.json
          echo; echo "Windows update published"
