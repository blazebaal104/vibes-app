name: Vibes Windows UI test

# Runs the desktop app (test jar from branch desktop-bin) on a virtual screen, follows the given steps
# (see desktop/uitest/x.py) and publishes the screenshots + log to branch desktop-shots.
# Triggered by pushing steps.txt to branch "uitest".
on:
  push:
    branches: [ uitest ]

permissions:
  contents: write
  id-token: write

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { path: steps }
      - uses: actions/checkout@v4
        with: { ref: desktop, path: src }
      - uses: actions/checkout@v4
        with: { ref: desktop-bin, path: bin }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb imagemagick fonts-noto-color-emoji pulseaudio pulseaudio-utils libasound2-plugins sox > /dev/null
          # virtual sound card: the app plays into it, we record what comes out
          pulseaudio --start --exit-idle-time=-1 && pactl load-module module-null-sink sink_name=vout && pactl set-default-sink vout
          printf 'pcm.!default { type pulse }\nctl.!default { type pulse }\n' > ~/.asoundrc
          pip install -q python-xlib
      - name: Test account
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=vibes-release" | jq -r .value)
          R=$(curl -sS --fail-with-body -X POST https://kxgswrwitsedppjzcokh.supabase.co/functions/v1/vibes-release -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{"testaccount":true}')
          echo "VIBES_EMAIL=$(echo "$R" | jq -r .email)" >> $GITHUB_ENV
          echo "::add-mask::$(echo "$R" | jq -r .password)"
          echo "VIBES_PASSWORD=$(echo "$R" | jq -r .password)" >> $GITHUB_ENV
      - name: Run app and steps
        run: |
          cat bin/vibes.jar.part-* > vibes.jar
          mkdir -p shots appdata
          export SHOTS=$PWD/shots APPDATA=$PWD/appdata DISPLAY=:99
          Xvfb :99 -screen 0 1440x900x24 > /dev/null 2>&1 &
          sleep 2
          VIBES_UITEST=1 VIBES_AUDIO_DUMP=$PWD/shots/dump.wav java -Xmx1g -jar vibes.jar > shots/app.log 2>&1 &
          parec -d vout.monitor --file-format=wav shots/out.wav &
          REC=$!
          python3 src/desktop/uitest/x.py $(cat steps/steps.txt) || echo "steps failed"
          sleep 1; kill $REC || true
          pkill -f vibes.jar || true; sleep 2
          # loudness per second of what the app played (0 = silence)
          sox shots/out.wav -n stat 2>&1 | tee shots/audio.txt || true
          python3 - <<'PY' >> shots/audio.txt
          import wave, struct, math
          import os
          w = wave.open("shots/dump.wav" if os.path.getsize("shots/dump.wav") > 1000 else "shots/out.wav")
          r, ch = w.getframerate(), w.getnchannels()
          out = []
          while True:
              f = w.readframes(r)
              if not f: break
              n = len(f) // 2
              s = struct.unpack("<%dh" % n, f[: n * 2])
              out.append(int(math.sqrt(sum(x * x for x in s) / max(1, n))))
          print("rms per second:", out)
          PY
          rm -f shots/out.wav shots/dump.wav
          tail -200 shots/app.log
      - name: Publish screenshots
        if: always()
        run: |
          cd shots
          git init -q && git checkout -q -b desktop-shots
          git add . && git -c user.name=ci -c user.email=ci@vibes commit -qm "shots ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" desktop-shots
