name: Vibes PC preview

# Fast check on branch desktop-dev (never publishes a release). PC and phone compile IN PARALLEL,
# the phone job also runs the Vibes unit tests (the ones that would block a release).
# Screenshots of the PC app only when the commit message contains [shots] (they cost ~3 minutes).
# Results (status.txt, errors, screenshots) go to branch desktop-dev-out.
# Every step is allowed to fail: the jobs always succeed, so no failure e-mails.
on:
  push:
    branches: [ desktop-dev ]

permissions:
  contents: write
  id-token: write

concurrency:
  group: vibes-desktop-dev
  cancel-in-progress: true

jobs:
  pc:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Compile PC app
        continue-on-error: true
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          mkdir -p out
          chmod +x gradlew
          set -o pipefail
          if [[ "$MSG" == *"[shots]"* ]]; then TASK=packageUberJarForCurrentOS; else TASK=compileKotlin; fi
          ./gradlew -p desktop $TASK --build-cache --parallel --continue 2>&1 | tee desktop.log && echo "PC: OK" >> out/status.txt || echo "PC: FAILED" >> out/status.txt
          grep -E "^e: " desktop.log | sed 's|file://.*/desktop/build/shared/|SHARED/|; s|file://.*/desktop/src/main/kotlin/|DESKTOP/|' | sort -u | head -300 > out/desktop-errors.txt || true
          grep -E "What went wrong" -A12 desktop.log | head -60 >> out/desktop-errors.txt || true
          cp desktop/build/compose/jars/*.jar vibes.jar 2>/dev/null || true
      - name: Screenshots
        if: contains(github.event.head_commit.message, '[shots]')
        continue-on-error: true
        run: |
          test -f vibes.jar || exit 0
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb imagemagick fonts-noto-color-emoji > /dev/null
          pip install -q python-xlib
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=vibes-release" | jq -r .value)
          R=$(curl -sS --fail-with-body -X POST https://kxgswrwitsedppjzcokh.supabase.co/functions/v1/vibes-release -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{"testaccount":true}')
          export VIBES_EMAIL=$(echo "$R" | jq -r .email)
          PW=$(echo "$R" | jq -r .password); echo "::add-mask::$PW"; export VIBES_PASSWORD=$PW
          mkdir -p shots appdata/Vibes/files
          cp desktop/uitest/demo_library.json appdata/Vibes/files/vibes_library.json 2>/dev/null || true
          export SHOTS=$PWD/out APPDATA=$PWD/appdata DISPLAY=:99
          Xvfb :99 -screen 0 1440x900x24 > /dev/null 2>&1 &
          sleep 2
          VIBES_UITEST=1 java -Xmx1g -jar vibes.jar > out/app.log 2>&1 &
          python3 desktop/uitest/x.py $(cat desktop/uitest/steps-dev.txt) || echo "steps failed"
          pkill -f vibes.jar || true
          tail -80 out/app.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pc
          path: out/

  phone:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Compile phone app + run unit tests
        continue-on-error: true
        run: |
          mkdir -p out
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:compileReleaseKotlin :app:testReleaseUnitTest --tests "dev.brahmkshatriya.echo.vibes.*" --build-cache --parallel --no-configuration-cache 2>&1 | tee android.log && echo "PHONE: OK (compiled + tests passed)" >> out/phone-status.txt || echo "PHONE: FAILED" >> out/phone-status.txt
          grep -E "^e: " android.log | sed 's|file://.*/app/src/main/java/||' | sort -u | head -200 > out/android-errors.txt || true
          grep -E "What went wrong|FAILED$" -A12 android.log | head -60 >> out/android-errors.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone
          path: out/

  publish:
    needs: [ pc, phone ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Publish
        run: |
          mkdir out
          cp -r art/pc/. out/ 2>/dev/null || true
          cp -r art/phone/. out/ 2>/dev/null || true
          cat out/phone-status.txt >> out/status.txt 2>/dev/null || echo "PHONE: no result" >> out/status.txt
          cat out/status.txt
          cd out
          git init -q && git checkout -q -b desktop-dev-out
          git add . && git -c user.name=ci -c user.email=ci@vibes commit -qm "preview ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" desktop-dev-out
