name: Vibes PC preview

# Work-in-progress check for the PC redesign, on branch desktop-dev only (never publishes a release).
# Compiles the PC app and the phone app, runs the PC app on a virtual screen with the CI test account,
# follows desktop/uitest/steps-dev.txt and pushes errors + screenshots to branch desktop-dev-out.
# Every step is allowed to fail: the job itself always succeeds, so no failure e-mails.
on:
  push:
    branches: [ desktop-dev ]

permissions:
  contents: write
  id-token: write

concurrency:
  group: vibes-desktop-dev
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Compile PC app
        continue-on-error: true
        run: |
          mkdir -p out
          chmod +x gradlew
          ./gradlew -p desktop packageUberJarForCurrentOS --continue 2>&1 | tee desktop.log || true
          grep -E "^e: " desktop.log | sed 's|file://.*/desktop/build/shared/|SHARED/|; s|file://.*/desktop/src/main/kotlin/|DESKTOP/|' | sort -u | head -300 > out/desktop-errors.txt || true
          grep -E "What went wrong" -A12 desktop.log | head -60 >> out/desktop-errors.txt || true
          cp desktop/build/compose/jars/*.jar vibes.jar 2>/dev/null && echo "PC: OK" >> out/status.txt || echo "PC: FAILED" >> out/status.txt
      - name: Compile phone app
        continue-on-error: true
        run: |
          ./gradlew :app:compileReleaseKotlin :app:compileReleaseUnitTestKotlin --build-cache --parallel --no-configuration-cache 2>&1 | tee android.log && echo "PHONE: OK" >> out/status.txt || echo "PHONE: FAILED" >> out/status.txt
          grep -E "^e: " android.log | sed 's|file://.*/app/src/main/java/||' | sort -u | head -200 > out/android-errors.txt || true
          grep -E "What went wrong" -A12 android.log | head -40 >> out/android-errors.txt || true
      - name: Screenshots
        continue-on-error: true
        run: |
          test -f vibes.jar || exit 0
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb imagemagick fonts-noto-color-emoji > /dev/null
          pip install -q python-xlib
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=vibes-release" | jq -r .value)
          R=$(curl -sS --fail-with-body -X POST https://kxgswrwitsedppjzcokh.supabase.co/functions/v1/vibes-release -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{"testaccount":true}')
          export VIBES_EMAIL=$(echo "$R" | jq -r .email)
          PW=$(echo "$R" | jq -r .password); echo "::add-mask::$PW"; export VIBES_PASSWORD=$PW
          mkdir -p shots appdata/Vibes/files
          # a library to look at (playlists, an album, a folder)
          cp desktop/uitest/demo_library.json appdata/Vibes/files/vibes_library.json 2>/dev/null || true
          export SHOTS=$PWD/out APPDATA=$PWD/appdata DISPLAY=:99
          Xvfb :99 -screen 0 1440x900x24 > /dev/null 2>&1 &
          sleep 2
          VIBES_UITEST=1 java -Xmx1g -jar vibes.jar > out/app.log 2>&1 &
          python3 desktop/uitest/x.py $(cat desktop/uitest/steps-dev.txt) || echo "steps failed"
          pkill -f vibes.jar || true
          tail -80 out/app.log
      - name: Publish
        if: always()
        run: |
          cd out
          git init -q && git checkout -q -b desktop-dev-out
          git add . && git -c user.name=ci -c user.email=ci@vibes commit -qm "preview ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" desktop-dev-out
